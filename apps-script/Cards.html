<!DOCTYPE html>
<html lang="fr">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; color: #14203a; }
      .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; padding: 8px 12px; background: #fff4e5; border: 1px solid #f0c27b; border-radius: 6px; }
      .toolbar p { margin: 0; flex: 1; }
      button { font: inherit; padding: 6px 14px; cursor: pointer; }
      #cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .card { border: 1px dashed #888; border-radius: 6px; padding: 10px; break-inside: avoid; display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; }
      .card svg { width: 110px; height: 110px; }
      .card h2 { margin: 0 0 4px; font-size: 13px; color: #102058; }
      .card .key { font: 700 13px/1.3 ui-monospace, Consolas, monospace; letter-spacing: 0.04em; word-break: break-all; }
      .card .meta { margin: 4px 0 0; font-size: 11px; color: #4f5b6e; }
      .card .legal { margin: 4px 0 0; font-size: 9px; color: #4f5b6e; }
      @media print { .no-print { display: none; } body { padding: 0; } }
    </style>
  </head>
  <body>
    <div class="toolbar no-print">
      <p>
        <strong>Ces clés ne seront plus jamais affichées.</strong> Imprimez sur une imprimante locale, découpez et
        mélangez les cartes, puis fermez cette fenêtre. Ne sauvegardez pas de PDF et ne notez pas qui reçoit quelle carte.
      </p>
      <button id="print" type="button">Imprimer</button>
      <button id="close" type="button">Fermer</button>
    </div>
    <main id="cards"></main>
    <?!= HtmlService.createHtmlOutputFromFile('QrLib').getContent() ?>
    <script>
      const DATA = <?!= data ?>;
      const container = document.getElementById('cards');
      DATA.cards.forEach((card) => {
        const qr = qrcode(0, 'M');
        qr.addData(DATA.siteUrl + '#k=' + card.key.replace(/-/g, ''));
        qr.make();

        const element = document.createElement('div');
        element.className = 'card';
        element.insertAdjacentHTML('beforeend', qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }));
        const text = document.createElement('div');
        const title = document.createElement('h2');
        title.textContent = 'UNSA STMicroelectronics : clé d’accès aux documents';
        const key = document.createElement('div');
        key.className = 'key';
        key.textContent = card.key;
        const meta = document.createElement('p');
        meta.className = 'meta';
        meta.textContent = 'N° ' + card.number + ' · valable jusqu’au ' + DATA.expires;
        const legal = document.createElement('p');
        legal.className = 'legal';
        legal.textContent =
          'Personnelle et confidentielle, liée à aucune identité. Scannez le QR code ou saisissez la clé sur la page Documents du site. Perte : communiquez le numéro ci-dessus.';
        text.append(title, key, meta, legal);
        element.append(text);
        container.append(element);
      });
      document.getElementById('print').addEventListener('click', () => window.print());
      document.getElementById('close').addEventListener('click', () => google.script.host.close());
    </script>
  </body>
</html>
